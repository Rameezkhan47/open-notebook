events {
    worker_connections 1024;
}

http {
    # Frontend - HTTP on 8502 (use HTTPS config + certs for production)
    server {
        listen 8502;
        server_name _;

        location / {
            proxy_pass http://open_notebook:8502;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Increase timeouts for LLM
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # API - HTTP on 5055 (use HTTPS config + certs for production)
    server {
        listen 5055;
        server_name _;

        client_max_body_size 100M;

        location / {
            proxy_pass http://open_notebook:5055;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Increase timeouts for LLM (5 minutes)
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
